<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048长者版</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{display:flex;flex-direction:column;align-items:center;background:#faf8ef;margin:15px 0;}
#container{
  position:relative;
  background:#bbada0;
  padding:12px;
  border-radius:8px;
  touch-action:none;
  width: calc(72px*4 + 8px*4 + 24px);
  height: calc(72px*4 + 8px*4 + 24px);
}
.row{display:none;}
.cell-bg{
  position:absolute;
  width:72px;height:72px;
  background:#cdc1b4;
  margin:4px;
  border-radius:6px;
}
.tile{
  position:absolute;
  width:72px;height:72px;
  margin:4px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 18px;
  line-height: 1.2;
  white-space: pre-wrap;
  word-break: normal;
  font-weight:bold;
  text-align:center;
  word-break:break-all;
  transition: transform 150ms ease-in-out;
  z-index:10;
}
.tile.new{
  animation: pop 200ms;
}
.tile.merge{
  animation: mergePop 200ms;
}
@keyframes pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
@keyframes mergePop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.score-box{font-size:20px;margin-bottom:10px}
#restart{padding:8px 16px;font-size:16px;margin-bottom:10px;border:none;border-radius:6px;background:#8f7a66;color:white;}
</style>
</head>
<body>
<div class="score-box">分数：<span id="score">0</span></div>
<button id="restart">重新开始</button>
<div id="container"></div>

<script>
const size=4;
let board=[];
let score=0;
let hasWon=false;
const container=document.getElementById('container');
const scoreEl=document.getElementById('score');
const restartBtn=document.getElementById('restart');

const textMap={
    2:"扬州\n江少",
    4:"中央\n大学",
    8:"交通\n大学",
    16:"长春\n一汽",
    32:"上海\n市长",
    64:"市委\n书记",
    128:"螳臂\n当车",
    256:"苟利\n国家",
    512:"如履\n薄冰",
    1024:"九八\n抗洪",
    2048:"三个\n代表",
    4096: "谈笑\n风生",
    8192:"怒斥\n港记",
    16384:"很惭愧！"
};

const colors={
    0:'#cdc1b4',
    2:'#eee4da',4:'#ede0c8',8:'#f2b179',
    16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',
    256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e',
    4096:'#b889e0',8192:'#9c62d0',16384:'#000000‌'
};

// 格子像素位置
function getPos(i,j){
  return {
    x: j * (72+8) + 12,
    y: i * (72+8) + 12
  }
}

// 绘制背景空位
function drawBackground(){
  container.querySelectorAll('.cell-bg').forEach(el=>el.remove());
  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){
      const bg=document.createElement('div');
      bg.className='cell-bg';
      const p=getPos(i,j);
      bg.style.left=p.x+'px';
      bg.style.top=p.y+'px';
      container.appendChild(bg);
    }
  }
}

// 初始化棋盘
function init(){
  board=Array(size).fill().map(()=>Array(size).fill(0));
  score=0;
  hasWon=False;
  drawBackground();
  container.querySelectorAll('.tile').forEach(el=>el.remove());
  addRandom();addRandom();
  renderTiles(true);
}

// 随机生成2或4
function addRandom(){
  let empty=[];
  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){
      if(board[i][j]===0) empty.push([i,j]);
    }
  }
  if(empty.length===0) return;
  const [x,y]=empty[Math.floor(Math.random()*empty.length)];
  board[x][y]=Math.random()<0.9?2:4;
}

// 渲染方块，带动画
function renderTiles(isNewGame=false){
  scoreEl.textContent=score;
  // 收集新棋盘数据
  let tileData=[];
  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){
      const v=board[i][j];
      if(v!==0){
        tileData.push({i,j,val:v});
      }
    }
  }

  const oldTiles=Array.from(container.querySelectorAll('.tile'));
  container.querySelectorAll('.tile').forEach(el=>el.remove());

  tileData.forEach(d=>{
    const tile=document.createElement('div');
    tile.className='tile';
    if(isNewGame) tile.classList.add('new');
    const p=getPos(d.i,d.j);
    tile.style.left=p.x+'px';
    tile.style.top=p.y+'px';
    tile.textContent=textMap[d.val];
    tile.style.backgroundColor=colors[d.val];
    tile.style.color=d.val<=4?'#776e65':'white';
    container.appendChild(tile);
  })
}

// 向左滑动一行
function slideLeft(row){
  let arr=row.filter(x=>x!==0);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i]*=2;
      score+=arr[i];
      arr.splice(i+1,1);
    }
  }
  while(arr.length<size) arr.push(0);
  return arr;
}

// 矩阵转置
function transpose(m){
  let res=Array(size).fill().map(()=>Array(size).fill(0));
  for(let i=0;i<size;i++)
    for(let j=0;j<size;j++) res[j][i]=m[i][j];
  return res;
}

// 矩阵每行反转
function reverse(m){
  return m.map(r=>[...r].reverse());
}

function moveLeft(){
  let changed=false;
  for(let i=0;i<size;i++){
    const old=[...board[i]];
    board[i]=slideLeft(board[i]);
    if(JSON.stringify(old)!==JSON.stringify(board[i])) changed=true;
  }
  return changed;
}
function moveRight(){
  board=reverse(board);
  const ch=moveLeft();
  board=reverse(board);
  return ch;
}
function moveUp(){
  board=transpose(board);
  const ch=moveLeft();
  board=transpose(board);
  return ch;
}
function moveDown(){
  board=transpose(board);
  const ch=moveRight();
  board=transpose(board);
  return ch;
}

async function doMove(dir){
  let changed=false;
  switch(dir){
    case 'left': changed=moveLeft(); break;
    case 'right': changed=moveRight(); break;
    case 'up': changed=moveUp(); break;
    case 'down': changed=moveDown(); break;
  }
  if(changed){
    renderTiles(false);
    await sleep(160);
    addRandom();
    renderTiles(false);
    checkWin();
    checkGameOver();
  }
}
function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

// 键盘方向键
document.addEventListener('keydown',async e=>{
  let dir=null;
  switch(e.key){
    case 'ArrowLeft': dir='left';break;
    case 'ArrowRight': dir='right';break;
    case 'ArrowUp': dir='up';break;
    case 'ArrowDown': dir='down';break;
  }
  if(dir) await doMove(dir);
})

// 触屏滑动
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});

document.addEventListener('touchend',async e=>{
  const dx=e.changedTouches[0].clientX - touchStartX;
  const dy=e.changedTouches[0].clientY - touchStartY;
  const minSwipe=30;
  let dir=null;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>minSwipe) dir='right';
    else if(dx<-minSwipe) dir='left';
  }else{
    if(dy>minSwipe) dir='down';
    else if(dy<-minSwipe) dir='up';
  }
  if(dir) await doMove(dir);
},{passive:true});

function canMove(){
  for(let i=0;i<size;i++){
    for(let j=0;j<size;j++){
      if(board[i][j]===0) return true;
      const v=board[i][j];
      if(j+1<size&&board[i][j+1]===v) return true;
      if(i+1<size&&board[i+1][j]===v) return true;
    }
  }
  return false;
}

function checkWin(){
  // 如果已经弹窗过，就不再重复弹窗
  if (hasWon) return;
  // 遍历棋盘检查是否有 16384 (对应“很惭愧”)
  for(let i=0; i<size; i++){
    for(let j=0; j<size; j++){
      if(board[i][j] === 1024){
        hasWon = true; // 标记为已触发
        // 使用 setTimeout 延迟一点点弹窗，让方块先完成合成动画并渲染出来
        setTimeout(() => {
          alert("现在你可以和我谈笑风生了！");
        }, 200);
        return;
      }
    }
  }
}
  
function checkGameOver(){
  if(!canMove()) alert(`还是要提升自己的姿势水平！分数：${score}`);
}

restartBtn.onclick=init;

init();
</script>
</body>
</html>
